name: PR Check

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore NvidiaCi.csproj

      - name: Check formatting
        run: dotnet format NvidiaCi.csproj --verify-no-changes --severity warn
        continue-on-error: true   # warn only, don't fail the PR

      - name: Build (Release)
        run: dotnet build NvidiaCi.csproj --configuration Release --no-restore

      - name: Comment build status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Build failed on this PR. Please check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
